apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: be2b10f4-9398-4de6-9e65-f42bc07c5473
    credentials-file: /etc/cloudflared-credentials/credentials.json
    protocol: http2
    ingress:
      - service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
          connectTimeout: 60s
          tlsTimeout: 30s
          tcpKeepAlive: 30s
          keepAliveTimeout: 90s

    loglevel: debug
    logfile: ""

    metrics: 0.0.0.0:2000
