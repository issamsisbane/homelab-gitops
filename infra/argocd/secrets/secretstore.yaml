apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argocd-store
  namespace: argocd
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "argocd"       # le KV mount créé par OpenTofu
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "role-argocd"          # créé par OpenTofu
          serviceAccountRef:
            name: "sa-vault-argocd"    # le SA ci-dessus
