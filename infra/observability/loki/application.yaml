apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0

    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary

        loki:
          commonConfig:
            replication_factor: 1
          auth_enabled: false
          schemaConfig:
            configs:
              - from: "2025-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: filesystem

          storage_config:
            filesystem:
              directory: /var/loki/chunks

          limits_config:
            retention_period: 168h
            allow_structured_metadata: true
            volume_enabled: true
            ingestion_burst_size_mb: 16
            ingestion_rate_mb: 8
            max_streams_per_user: 10000

        singleBinary:
          replicas: 1

          persistence:
            enabled: true
            storageClass: longhorn
            size: 20Gi

          resources:
            requests:
              memory: "50Mi"
              cpu: "100m"
            limits:
              memory: "600Mi"
              cpu: "300m"

        backend:
          replicas: 0

        read:
          replicas: 0

        write:
          replicas: 0

        ingester:
          replicas: 0

        querier:
          replicas: 0

        queryFrontend:
          replicas: 0

        queryScheduler:
          replicas: 0

        distributor:
          replicas: 0

        compactor:
          replicas: 0

        indexGateway:
          replicas: 0

        bloomCompactor:
          replicas: 0

        bloomGateway:
          replicas: 0

        gateway:
          enabled: false

        monitoring:
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          lokiCanary:
            enabled: false

        test:
          enabled: false

        chunksCache:
          enabled: false

        resultsCache:
          enabled: false

        lokiCanary:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
