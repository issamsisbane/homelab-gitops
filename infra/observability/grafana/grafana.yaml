apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: grafana
spec:
  config:
    database:
			type: "postgres"
      ssl_mode: "require"
    server:
      domain: "grafana.tail7e39b9.ts.net"
      root_url: "https://grafana.tail7e39b9.ts.net"
      serve_from_sub_path: "false"
    auth:
      disable_login_form: "false"
    auth.generic_oauth:
      enabled: "true"
      name: "Authelia SSO"
      allow_sign_up: "true"
      client_id: "${AUTH_CLIENT_ID}"
      client_secret: "${AUTH_CLIENT_SECRET}"
      scopes: "openid email profile groups"
      auth_url: "https://auth.issamhomelab.org/api/oidc/authorization"
      token_url: "https://auth.issamhomelab.org/api/oidc/token"
      api_url: "https://auth.issamhomelab.org/api/oidc/userinfo"
      email_attribute_path: "email"
      login_attribute_path: "preferred_username"
      use_pkce: "true"
			allow_assign_grafana_admin: "true"
      name_attribute_path: "name"
      groups_attribute_path: "groups"
      role_attribute_path: "contains(groups[*], 'k8s-admins') && 'Admin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'"
    auth.anonymous:
      enabled: "false"
    log:
      level: warn
    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"

  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 1Gi

  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: client-id
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: client-secret
								 name: GF_DATABASE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: grafana-cnpg-app   # nom du secret généré par CNPG
                      key: host
                - name: GF_DATABASE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: grafana-cnpg-app
                      key: dbname
                - name: GF_DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-cnpg-app
                      key: user
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-cnpg-app
                      key: password
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
