apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: readeck
  namespace: readeck
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: readeck-secret
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: readeck/config
        property: secret-key
    - secretKey: oidc-client-secret
      remoteRef:
        key: readeck/config
        property: oidc-client-secret
    - secretKey: oidc-client-id
      remoteRef:
        key: readeck/config
        property: oidc-client-id
