apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
  labels:
    app: miniflux
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      containers:
        - name: miniflux
          image: miniflux/miniflux:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: miniflux-cnpg-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-cnpg-app
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: miniflux-cnpg-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: miniflux-cnpg-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: miniflux-cnpg-app
                  key: dbname

            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"

            - name: RUN_MIGRATIONS
              value: "1"

            - name: CREATE_ADMIN
              value: "1"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin
                  key: password

            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            exec:
              command: ["/usr/bin/miniflux", "-healthcheck", "auto"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command: ["/usr/bin/miniflux", "-healthcheck", "auto"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
